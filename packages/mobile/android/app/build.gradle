apply plugin: 'com.android.application'

def ciVersionCode = System.getenv('OPENCHAMBER_ANDROID_VERSION_CODE')
def ciVersionName = System.getenv('OPENCHAMBER_ANDROID_VERSION_NAME')
def ciKeystorePath = System.getenv('OPENCHAMBER_ANDROID_KEYSTORE_PATH')
def ciKeystorePassword = System.getenv('OPENCHAMBER_ANDROID_KEYSTORE_PASSWORD')
def ciKeyAlias = System.getenv('OPENCHAMBER_ANDROID_KEY_ALIAS')
def ciKeyPassword = System.getenv('OPENCHAMBER_ANDROID_KEY_PASSWORD')
def hasCiSigning = ciKeystorePath && ciKeystorePassword && ciKeyAlias && ciKeyPassword

android {
    namespace "com.openchamber.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.openchamber.fork"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 1
        versionName ciVersionName ?: "1.0"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasCiSigning) {
                storeFile file(ciKeystorePath)
                storePassword ciKeystorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds are labelled apart from the upstream app that shares the Java namespace.
            resValue "string", "app_name", "OpenChamber Monitor Debug"
            resValue "string", "title_activity_main", "OpenChamber Monitor Debug"
        }
        release {
            if (hasCiSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // SealedPushMessagingService extends the push plugin's service and reads RemoteMessage,
    // which the plugin keeps as an implementation detail. Same artifact and version as the
    // plugin (firebaseMessagingVersion in variables.gradle), not a new library.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    // The plugin fails the build when the file has no client for the applicationId, so it is
    // applied only for a package the file registers. Other packages build without push.
    def registeredPackages = servicesJSON.text
        ? new groovy.json.JsonSlurper().parse(servicesJSON).client.collect { it.client_info.android_client_info.package_name }
        : []
    if (registeredPackages.contains(android.defaultConfig.applicationId)) {
        apply plugin: 'com.google.gms.google-services'
    } else {
        logger.warn("google-services.json has no client for ${android.defaultConfig.applicationId}; Push Notifications are not configured for this build")
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
